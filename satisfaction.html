<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>居家服務滿意度調查</title>
<style>
  :root {
    --bg: #EFF3F0;
    --ink: #2B2B26;
    --ink-soft: #5B5B52;
    --teal: #2C5F55;
    --teal-dark: #1F473F;
    --line: #DAE0DA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }
  .back {
    display: inline-block;
    color: var(--teal-dark);
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    margin-bottom: 12px;
  }
  header {
    text-align: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 3px solid var(--teal);
  }
  header .org {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 900;
    color: var(--teal-dark);
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    color: var(--ink);
    font-weight: 700;
  }
  .form-frame {
    width: 100%;
    height: calc(100vh - 170px);
    min-height: 600px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
  }
  .fallback {
    margin-top: 14px;
    text-align: center;
    font-size: 15px;
    color: var(--ink-soft);
  }
  .fallback a { color: var(--teal-dark); font-weight: 700; }
  /* ---------- 浮水印（滿版鎖定版）---------- */
  .watermark {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 99999;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzODAiIGhlaWdodD0iMjAwIiB2aWV3Qm94PSIwIDAgMzgwIDIwMCI+Cjx0ZXh0IHg9IjE5MC4wIiB5PSIxMDAuMCIgZm9udC1mYW1pbHk9Ik5vdG8gU2FucyBUQywgUGluZ0ZhbmcgVEMsIE1pY3Jvc29mdCBKaGVuZ0hlaSwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzAwMDAwMCIgZmlsbC1vcGFjaXR5PSIwLjExIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0cmFuc2Zvcm09InJvdGF0ZSgtMjggMTkwLjAgMTAwLjApIj7oh7rkuK3luILnp4Hnq4vmib/mganlsYXlrrbplbfnhafmqZ/mp4s8L3RleHQ+Cjwvc3ZnPg==");
    background-repeat: repeat;
    background-position: 0 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @media print {
    .watermark { display: block !important; position: fixed; }
  }
</style>
</head>
<body>
<div class="watermark" aria-hidden="true"></div>
<script>
(function(){
  function ensureWatermark(){
    if(!document.querySelector('.watermark')){
      var wm=document.createElement('div');
      wm.className='watermark';
      wm.setAttribute('aria-hidden','true');
      document.body.insertBefore(wm,document.body.firstChild);
    }
  }
  document.addEventListener('DOMContentLoaded',ensureWatermark);
  if(document.body){
    new MutationObserver(ensureWatermark).observe(document.documentElement,{childList:true,subtree:true});
  }
  document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
})();
</script>
<div class="wrap">

          title="居家服務滿意度調查">

  </div>
</div>
</body>
</html>
