<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長期照顧專業人員數位學習平台</title>
<style>
  :root {
    --bg: #EFF3F0;
    --card-bg: #FFFFFF;
    --ink: #2B2B26;
    --ink-soft: #5B5B52;
    --teal: #2C5F55;
    --teal-dark: #1F473F;
    --ochre: #C98A2C;
    --line: #DAE0DA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 3px solid var(--teal);
  }
  header .eyebrow {
    font-size: 16px;
    color: var(--teal);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  header h1 {
    font-size: 24px;
    margin: 0 0 12px;
    color: var(--teal-dark);
    font-weight: 900;
  }
  header .header-link {
    display: inline-block;
    font-size: 18px;
    font-weight: 800;
    color: var(--ochre);
    text-decoration: underline;
  }
  header .header-link:hover,
  header .header-link:focus-visible {
    color: #A8721E;
  }

  .pdf-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .pdf-panel .pdf-page {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 1px 3px rgba(31,71,63,0.06);
    background: var(--card-bg);
  }

  footer {
    margin-top: 36px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 15px;
    border-top: 1px solid var(--line);
    padding-top: 20px;
  }

  /* ---------- 浮水印（滿版鎖定版）---------- */
  .watermark {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 99999;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzODAiIGhlaWdodD0iMjAwIiB2aWV3Qm94PSIwIDAgMzgwIDIwMCI+Cjx0ZXh0IHg9IjE5MC4wIiB5PSIxMDAuMCIgZm9udC1mYW1pbHk9Ik5vdG8gU2FucyBUQywgUGluZ0ZhbmcgVEMsIE1pY3Jvc29mdCBKaGVuZ0hlaSwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzAwMDAwMCIgZmlsbC1vcGFjaXR5PSIwLjExIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0cmFuc2Zvcm09InJvdGF0ZSgtMjggMTkwLjAgMTAwLjApIj7oh7rkuK3luILnp4Hnq4vmib/mganlsYXlrrbplbfnhafmqZ/mp4s8L3RleHQ+Cjwvc3ZnPg==");
    background-repeat: repeat;
    background-position: 0 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @media print {
    .watermark { display: block !important; position: fixed; }
  }
</style>
</head>
<body>
  <div class="watermark" aria-hidden="true"></div>
  <script>
  (function(){
    function ensureWatermark(){
      if(!document.querySelector('.watermark')){
        var wm = document.createElement('div');
        wm.className = 'watermark';
        wm.setAttribute('aria-hidden', 'true');
        document.body.insertBefore(wm, document.body.firstChild);
      }
    }
    document.addEventListener('DOMContentLoaded', ensureWatermark);
    if (document.body) {
      var observer = new MutationObserver(ensureWatermark);
      observer.observe(document.documentElement, { childList: true, subtree: true });
    }
    document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  })();
  </script>

<div class="wrap">

</div>
</body>
</html>
